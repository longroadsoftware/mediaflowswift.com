<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 148" width="720" height="148" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
<title id="t">Three folder models, and the hybrid most solo creators use</title>
<desc id="d">Three top-level folder models: project-based, date-based and shot-type-based. Most solo creators end up with a hybrid: a date-first project folder on disk, with shot type and camera one level down.</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#555"/></marker></defs>
<rect x="1" y="1" width="718" height="146" rx="12" fill="#ffffff" stroke="#d6d6d6"/>
<text x="360.0" y="26" font-size="16" font-weight="bold" fill="#222" text-anchor="middle">Three folder models, and the hybrid most solo creators use</text>
<text x="14" y="56" font-size="14" font-weight="normal" fill="#333" text-anchor="start">Pick one top level, or combine:</text>
<rect x="14.0" y="66" width="222.7" height="52" rx="8" fill="#f4f4f4" stroke="#555" stroke-width="1.2"/>
<text x="125.3" y="88.0" font-size="15" font-weight="bold" fill="#222" text-anchor="middle">Project-</text>
<text x="125.3" y="107.0" font-size="14" font-weight="normal" fill="#222" text-anchor="middle">based</text>
<line x1="236.7" y1="92.0" x2="246.7" y2="92.0" stroke="#555" stroke-width="1.6" marker-end="url(#a)"/>
<rect x="248.7" y="66" width="222.7" height="52" rx="8" fill="#f4f4f4" stroke="#555" stroke-width="1.2"/>
<text x="360.0" y="88.0" font-size="15" font-weight="bold" fill="#222" text-anchor="middle">Date-</text>
<text x="360.0" y="107.0" font-size="14" font-weight="normal" fill="#222" text-anchor="middle">based</text>
<line x1="471.3" y1="92.0" x2="481.3" y2="92.0" stroke="#555" stroke-width="1.6" marker-end="url(#a)"/>
<rect x="483.3" y="66" width="222.7" height="52" rx="8" fill="#f4f4f4" stroke="#555" stroke-width="1.2"/>
<text x="594.7" y="88.0" font-size="15" font-weight="bold" fill="#222" text-anchor="middle">Shot-type-</text>
<text x="594.7" y="107.0" font-size="14" font-weight="normal" fill="#222" text-anchor="middle">based</text>
<text x="360.0" y="132" font-size="13" font-weight="normal" fill="#333" text-anchor="middle">Most solo creators use a hybrid: date-first folders, with shot type and camera underneath.</text>
</svg>