<text x="96.0" y="97.0" font-size="15" font-weight="bold" fill="#222" text-anchor="middle">Ingest</text>
<line x1="178.0" y1="92.0" x2="188.0" y2="92.0" stroke="#555" stroke-width="1.6" marker-end="url(#a)"/>
