<text x="272.0" y="97.0" font-size="15" font-weight="bold" fill="#222" text-anchor="middle">Organize</text>
<line x1="354.0" y1="92.0" x2="364.0" y2="92.0" stroke="#555" stroke-width="1.6" marker-end="url(#a)"/>
<rect x="366.0" y="66" width="164.0" height="52" rx="8" fill="#f4f4f4" stroke="#555" stroke-width="1.2"/>
<text x="448.0" y="97.0" font-size="15" font-weight="bold" fill="#222" text-anchor="middle">Enrich</text>
<line x1="530.0" y1="92.0" x2="540.0" y2="92.0" stroke="#555" stroke-width="1.6" marker-end="url(#a)"/>
<rect x="542.0" y="66" width="164.0" height="52" rx="8" fill="#f4f4f4" stroke="#555" stroke-width="1.2"/>
<text x="624.0" y="97.0" font-size="15" font-weight="bold" fill="#222" text-anchor="middle">Review</text>
<text x="14" y="180" font-size="14" font-weight="normal" fill="#333" text-anchor="start"></text>
<rect x="14.0" y="190" width="222.7" height="52" rx="8" fill="#f4f4f4" stroke="#555" stroke-width="1.2"/>
<text x="125.3" y="221.0" font-size="15" font-weight="bold" fill="#222" text-anchor="middle">Hand off</text>
<line x1="236.7" y1="216.0" x2="246.7" y2="216.0" stroke="#555" stroke-width="1.6" marker-end="url(#a)"/>
<rect x="248.7" y="190" width="222.7" height="52" rx="8" fill="#f4f4f4" stroke="#555" stroke-width="1.2"/>
<text x="360.0" y="221.0" font-size="15" font-weight="bold" fill="#222" text-anchor="middle">Archive</text>
