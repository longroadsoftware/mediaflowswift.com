<text x="360.0" y="26" font-size="16" font-weight="bold" fill="#222" text-anchor="middle">How footage moves from shoot to archive in a video catalog</text>
<text x="14" y="56" font-size="14" font-weight="normal" fill="#333" text-anchor="start">Shoot to archive:</text>
