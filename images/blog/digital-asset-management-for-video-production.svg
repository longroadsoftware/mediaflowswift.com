<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 252" width="720" height="252" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
<title id="t">How footage moves from shoot to archive in a video catalog</title>
<desc id="d">Seven stages: ingest the card with a checksum-verified copy; organize clips into a folder layout; enrich with transcripts, places and proxies; review and rate clips; hand off selects to the editor; archive finished projects to numbered drives; and retrieve by searching the catalog and connecting the one drive it names.</desc>
