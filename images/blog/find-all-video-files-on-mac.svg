<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 252" width="720" height="252" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
<title id="t">Search methods, then the verification before deleting anything</title>
<desc id="d">Top row, three ways to search a Mac for video files: a Finder Kind is Movie search, a Terminal find command by file extension, and an mdfind Spotlight query. Bottom row, the verification before deleting anything: compare file counts, compare byte totals, then spot-check with a SHA-256 checksum.</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#555"/></marker></defs>
<rect x="1" y="1" width="718" height="250" rx="12" fill="#ffffff" stroke="#d6d6d6"/>
<text x="360.0" y="26" font-size="16" font-weight="bold" fill="#222" text-anchor="middle">Search methods, then the verification before deleting anything</text>
<text x="14" y="56" font-size="14" font-weight="normal" fill="#333" text-anchor="start">Search methods:</text>
<rect x="14.0" y="66" width="222.7" height="52" rx="8" fill="#f4f4f4" stroke="#555" stroke-width="1.2"/>
<text x="125.3" y="88.0" font-size="15" font-weight="bold" fill="#222" text-anchor="middle">Finder</text>
<text x="125.3" y="107.0" font-size="14" font-weight="normal" fill="#222" text-anchor="middle">search</text>
<line x1="236.7" y1="92.0" x2="246.7" y2="92.0" stroke="#555" stroke-width="1.6" marker-end="url(#a)"/>
<rect x="248.7" y="66" width="222.7" height="52" rx="8" fill="#f4f4f4" stroke="#555" stroke-width="1.2"/>
<text x="360.0" y="88.0" font-size="15" font-weight="bold" fill="#222" text-anchor="middle">Terminal</text>
<text x="360.0" y="107.0" font-size="14" font-weight="normal" fill="#222" text-anchor="middle">find</text>
<line x1="471.3" y1="92.0" x2="481.3" y2="92.0" stroke="#555" stroke-width="1.6" marker-end="url(#a)"/>
<rect x="483.3" y="66" width="222.7" height="52" rx="8" fill="#f4f4f4" stroke="#555" stroke-width="1.2"/>
<text x="594.7" y="88.0" font-size="15" font-weight="bold" fill="#222" text-anchor="middle">mdfind</text>
<text x="594.7" y="107.0" font-size="14" font-weight="normal" fill="#222" text-anchor="middle">query</text>
<text x="14" y="180" font-size="14" font-weight="normal" fill="#333" text-anchor="start">Verify before deleting:</text>
<rect x="14.0" y="190" width="222.7" height="52" rx="8" fill="#f4f4f4" stroke="#555" stroke-width="1.2"/>
<text x="125.3" y="212.0" font-size="15" font-weight="bold" fill="#222" text-anchor="middle">Compare</text>
<text x="125.3" y="231.0" font-size="14" font-weight="normal" fill="#222" text-anchor="middle">counts</text>
<line x1="236.7" y1="216.0" x2="246.7" y2="216.0" stroke="#555" stroke-width="1.6" marker-end="url(#a)"/>
<rect x="248.7" y="190" width="222.7" height="52" rx="8" fill="#f4f4f4" stroke="#555" stroke-width="1.2"/>
<text x="360.0" y="212.0" font-size="15" font-weight="bold" fill="#222" text-anchor="middle">Compare</text>
<text x="360.0" y="231.0" font-size="14" font-weight="normal" fill="#222" text-anchor="middle">totals</text>
<line x1="471.3" y1="216.0" x2="481.3" y2="216.0" stroke="#555" stroke-width="1.6" marker-end="url(#a)"/>
