<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 128" width="720" height="128" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
<title id="t">The three jobs video asset management does for a solo creator</title>
<desc id="d">Three jobs: verify every card copy with a checksum; keep a catalog you can search by more than file name; and record which archive drive holds each project, even while it sits on a shelf.</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#555"/></marker></defs>
<rect x="1" y="1" width="718" height="126" rx="12" fill="#ffffff" stroke="#d6d6d6"/>
<text x="360.0" y="26" font-size="16" font-weight="bold" fill="#222" text-anchor="middle">The three jobs video asset management does for a solo creator</text>
<text x="14" y="56" font-size="14" font-weight="normal" fill="#333" text-anchor="start">What Finder can&#39;t do alone:</text>
<rect x="14.0" y="66" width="222.7" height="52" rx="8" fill="#f4f4f4" stroke="#555" stroke-width="1.2"/>
<text x="125.3" y="88.0" font-size="15" font-weight="bold" fill="#222" text-anchor="middle">Verify</text>
<text x="125.3" y="107.0" font-size="14" font-weight="normal" fill="#222" text-anchor="middle">every copy</text>
<line x1="236.7" y1="92.0" x2="246.7" y2="92.0" stroke="#555" stroke-width="1.6" marker-end="url(#a)"/>
<rect x="248.7" y="66" width="222.7" height="52" rx="8" fill="#f4f4f4" stroke="#555" stroke-width="1.2"/>
<text x="360.0" y="88.0" font-size="15" font-weight="bold" fill="#222" text-anchor="middle">Catalog</text>
<text x="360.0" y="107.0" font-size="14" font-weight="normal" fill="#222" text-anchor="middle">&amp; search</text>
<line x1="471.3" y1="92.0" x2="481.3" y2="92.0" stroke="#555" stroke-width="1.6" marker-end="url(#a)"/>
<rect x="483.3" y="66" width="222.7" height="52" rx="8" fill="#eaf1fe" stroke="#2a6df4" stroke-width="2"/>
<text x="594.7" y="88.0" font-size="15" font-weight="bold" fill="#2a6df4" text-anchor="middle">Record which</text>
<text x="594.7" y="107.0" font-size="14" font-weight="normal" fill="#2a6df4" text-anchor="middle">drive holds it</text>
</svg>