<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 128" width="720" height="128" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
<title id="t">The four jobs a Mac video library app should do</title>
<desc id="d">Four jobs: browse thumbnails, durations and dates for every clip; preview and step through a clip without opening an editor; search by camera, tag, note, scene or spoken words; and remember what an unplugged archive drive holds.</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#555"/></marker></defs>
<rect x="1" y="1" width="718" height="126" rx="12" fill="#ffffff" stroke="#d6d6d6"/>
<text x="360.0" y="26" font-size="16" font-weight="bold" fill="#222" text-anchor="middle">The four jobs a Mac video library app should do</text>
<text x="14" y="56" font-size="14" font-weight="normal" fill="#333" text-anchor="start">What a library app should do:</text>
<rect x="14.0" y="66" width="164.0" height="52" rx="8" fill="#f4f4f4" stroke="#555" stroke-width="1.2"/>
<text x="96.0" y="97.0" font-size="15" font-weight="bold" fill="#222" text-anchor="middle">Browse</text>
<line x1="178.0" y1="92.0" x2="188.0" y2="92.0" stroke="#555" stroke-width="1.6" marker-end="url(#a)"/>
<rect x="190.0" y="66" width="164.0" height="52" rx="8" fill="#f4f4f4" stroke="#555" stroke-width="1.2"/>
<text x="272.0" y="97.0" font-size="15" font-weight="bold" fill="#222" text-anchor="middle">Preview</text>
<line x1="354.0" y1="92.0" x2="364.0" y2="92.0" stroke="#555" stroke-width="1.6" marker-end="url(#a)"/>
<rect x="366.0" y="66" width="164.0" height="52" rx="8" fill="#f4f4f4" stroke="#555" stroke-width="1.2"/>
<text x="448.0" y="97.0" font-size="15" font-weight="bold" fill="#222" text-anchor="middle">Search</text>
<line x1="530.0" y1="92.0" x2="540.0" y2="92.0" stroke="#555" stroke-width="1.6" marker-end="url(#a)"/>
<rect x="542.0" y="66" width="164.0" height="52" rx="8" fill="#eaf1fe" stroke="#2a6df4" stroke-width="2"/>
<text x="624.0" y="88.0" font-size="15" font-weight="bold" fill="#2a6df4" text-anchor="middle">Remember</text>
<text x="624.0" y="107.0" font-size="14" font-weight="normal" fill="#2a6df4" text-anchor="middle">unplugged drives</text>
</svg>