<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 128" width="720" height="128" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
<title id="t">Five-year cost per terabyte for a 50 TB video archive, October 2026</title>
<desc id="d">Approximate five-year cost per terabyte for one copy of a 50 terabyte archive: external drives on a shelf, about 55 to 60 dollars; a four-bay NAS, about 90 to 155 dollars; an LTO-9 drive and tapes, about 255 to 285 dollars; and Amazon S3 Glacier Deep Archive storage only, about 61 dollars, rising to about 151 dollars with one full restore.</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#555"/></marker></defs>
<rect x="1" y="1" width="718" height="126" rx="12" fill="#ffffff" stroke="#d6d6d6"/>
<text x="360.0" y="26" font-size="16" font-weight="bold" fill="#222" text-anchor="middle">Five-year cost per terabyte for a 50 TB video archive, October 2026</text>
<text x="14" y="56" font-size="14" font-weight="normal" fill="#333" text-anchor="start">Cost per TB over 5 years, one copy of 50 TB:</text>
<rect x="14.0" y="66" width="164.0" height="52" rx="8" fill="#f4f4f4" stroke="#555" stroke-width="1.2"/>
<text x="96.0" y="88.0" font-size="15" font-weight="bold" fill="#222" text-anchor="middle">Drives on shelf</text>
<text x="96.0" y="107.0" font-size="14" font-weight="normal" fill="#222" text-anchor="middle">$55-60</text>
<line x1="178.0" y1="92.0" x2="188.0" y2="92.0" stroke="#555" stroke-width="1.6" marker-end="url(#a)"/>
<rect x="190.0" y="66" width="164.0" height="52" rx="8" fill="#f4f4f4" stroke="#555" stroke-width="1.2"/>
<text x="272.0" y="88.0" font-size="15" font-weight="bold" fill="#222" text-anchor="middle">4-bay NAS</text>
<text x="272.0" y="107.0" font-size="14" font-weight="normal" fill="#222" text-anchor="middle">$90-155</text>
<line x1="354.0" y1="92.0" x2="364.0" y2="92.0" stroke="#555" stroke-width="1.6" marker-end="url(#a)"/>
<rect x="366.0" y="66" width="164.0" height="52" rx="8" fill="#f4f4f4" stroke="#555" stroke-width="1.2"/>
<text x="448.0" y="88.0" font-size="15" font-weight="bold" fill="#222" text-anchor="middle">LTO-9 + tapes</text>
<text x="448.0" y="107.0" font-size="14" font-weight="normal" fill="#222" text-anchor="middle">$255-285</text>
<line x1="530.0" y1="92.0" x2="540.0" y2="92.0" stroke="#555" stroke-width="1.6" marker-end="url(#a)"/>
<rect x="542.0" y="66" width="164.0" height="52" rx="8" fill="#f4f4f4" stroke="#555" stroke-width="1.2"/>
<text x="624.0" y="88.0" font-size="15" font-weight="bold" fill="#222" text-anchor="middle">Glacier Deep</text>
<text x="624.0" y="107.0" font-size="14" font-weight="normal" fill="#222" text-anchor="middle">$61-151</text>
</svg>