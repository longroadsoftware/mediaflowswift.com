<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 128" width="720" height="128" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
<title id="t">The safe order: verify, then format in the camera</title>
<desc id="d">Three steps: a verified copy exists on a drive, checked against the card; a second checked copy ideally exists on another drive; then the card is formatted in the camera that will record on it next, which writes the folder layout that camera expects.</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#555"/></marker></defs>
<rect x="1" y="1" width="718" height="126" rx="12" fill="#ffffff" stroke="#d6d6d6"/>
<text x="360.0" y="26" font-size="16" font-weight="bold" fill="#222" text-anchor="middle">The safe order: verify, then format in the camera</text>
<text x="14" y="56" font-size="14" font-weight="normal" fill="#333" text-anchor="start">Before any card is cleared:</text>
<rect x="14.0" y="66" width="222.7" height="52" rx="8" fill="#f4f4f4" stroke="#555" stroke-width="1.2"/>
<text x="125.3" y="88.0" font-size="15" font-weight="bold" fill="#222" text-anchor="middle">Verified copy</text>
<text x="125.3" y="107.0" font-size="14" font-weight="normal" fill="#222" text-anchor="middle">on a drive</text>
<line x1="236.7" y1="92.0" x2="246.7" y2="92.0" stroke="#555" stroke-width="1.6" marker-end="url(#a)"/>
<rect x="248.7" y="66" width="222.7" height="52" rx="8" fill="#f4f4f4" stroke="#555" stroke-width="1.2"/>
<text x="360.0" y="88.0" font-size="15" font-weight="bold" fill="#222" text-anchor="middle">Second checked</text>
<text x="360.0" y="107.0" font-size="14" font-weight="normal" fill="#222" text-anchor="middle">copy (ideal)</text>
<line x1="471.3" y1="92.0" x2="481.3" y2="92.0" stroke="#555" stroke-width="1.6" marker-end="url(#a)"/>
<rect x="483.3" y="66" width="222.7" height="52" rx="8" fill="#eaf1fe" stroke="#2a6df4" stroke-width="2"/>
<text x="594.7" y="88.0" font-size="15" font-weight="bold" fill="#2a6df4" text-anchor="middle">Format in the</text>
<text x="594.7" y="107.0" font-size="14" font-weight="normal" fill="#2a6df4" text-anchor="middle">next camera</text>
</svg>