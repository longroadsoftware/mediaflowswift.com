<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 260" width="720" height="260" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
<title id="t">Two checked copies of a card, made one after the other in MediaFlowSwift</title>
<desc id="d">Five steps left to right: the card; Import copies each clip, reads it back and compares SHA-256 checksums; copy one on the working drive, organized at the project's destination; Archive to USB copies the project folder, reads each file back and compares it; copy two on the archive drive. Only the project folder is archived, and the card stays untouched until you run Clear Card.</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#555"/></marker></defs>
<rect x="1" y="1" width="718" height="258" rx="12" fill="#ffffff" stroke="#d6d6d6"/>
<text x="360.0" y="34" font-size="16" font-weight="bold" fill="#222" text-anchor="middle">Two checked copies, one after the other</text>
<rect x="14.0" y="58" width="124.0" height="112" rx="8" fill="#f4f4f4" stroke="#555" stroke-width="1.2"/>
<text x="76.0" y="101.0" font-size="15" font-weight="bold" fill="#222" text-anchor="middle">Card</text>
<text x="76.0" y="119.0" font-size="14" font-weight="normal" fill="#222" text-anchor="middle">original clips</text>
<text x="76.0" y="137.0" font-size="14" font-weight="normal" fill="#222" text-anchor="middle">stay on it</text>
<line x1="141.0" y1="114.0" x2="153.0" y2="114.0" stroke="#555" stroke-width="1.6" marker-end="url(#a)"/>
<rect x="156.0" y="58" width="124.0" height="112" rx="8" fill="#f4f4f4" stroke="#555" stroke-width="1.2"/>
<text x="218.0" y="92.0" font-size="15" font-weight="bold" fill="#222" text-anchor="middle">Import</text>
<text x="218.0" y="110.0" font-size="14" font-weight="normal" fill="#222" text-anchor="middle">copy, read back,</text>
<text x="218.0" y="128.0" font-size="14" font-weight="normal" fill="#222" text-anchor="middle">compare</text>
<text x="218.0" y="146.0" font-size="14" font-weight="normal" fill="#222" text-anchor="middle">SHA-256</text>
<line x1="283.0" y1="114.0" x2="295.0" y2="114.0" stroke="#555" stroke-width="1.6" marker-end="url(#a)"/>
<rect x="298.0" y="58" width="124.0" height="112" rx="8" fill="#f4f4f4" stroke="#555" stroke-width="1.2"/>
<text x="360.0" y="92.0" font-size="15" font-weight="bold" fill="#222" text-anchor="middle">Copy 1</text>
<text x="360.0" y="110.0" font-size="14" font-weight="normal" fill="#222" text-anchor="middle">working drive:</text>
<text x="360.0" y="128.0" font-size="14" font-weight="normal" fill="#222" text-anchor="middle">organized at the</text>
<text x="360.0" y="146.0" font-size="14" font-weight="normal" fill="#222" text-anchor="middle">destination</text>
<line x1="425.0" y1="114.0" x2="437.0" y2="114.0" stroke="#555" stroke-width="1.6" marker-end="url(#a)"/>
<rect x="440.0" y="58" width="124.0" height="112" rx="8" fill="#f4f4f4" stroke="#555" stroke-width="1.2"/>
<text x="502.0" y="92.0" font-size="15" font-weight="bold" fill="#222" text-anchor="middle">Archive to USB</text>
<text x="502.0" y="110.0" font-size="14" font-weight="normal" fill="#222" text-anchor="middle">project folder</text>
<text x="502.0" y="128.0" font-size="14" font-weight="normal" fill="#222" text-anchor="middle">copied, read</text>
<text x="502.0" y="146.0" font-size="14" font-weight="normal" fill="#222" text-anchor="middle">back, compared</text>
<line x1="567.0" y1="114.0" x2="579.0" y2="114.0" stroke="#555" stroke-width="1.6" marker-end="url(#a)"/>
<rect x="582.0" y="58" width="124.0" height="112" rx="8" fill="#eaf1fe" stroke="#2a6df4" stroke-width="2"/>
<text x="644.0" y="101.0" font-size="15" font-weight="bold" fill="#2a6df4" text-anchor="middle">Copy 2</text>
<text x="644.0" y="119.0" font-size="14" font-weight="normal" fill="#222" text-anchor="middle">archive drive,</text>
<text x="644.0" y="137.0" font-size="14" font-weight="normal" fill="#222" text-anchor="middle">on the shelf</text>
<text x="360.0" y="204" font-size="14" font-weight="normal" fill="#333" text-anchor="middle">Only the project folder is archived.</text>
<text x="360.0" y="226" font-size="14" font-weight="normal" fill="#333" text-anchor="middle">The card stays untouched until you run Clear Card.</text>
</svg>
