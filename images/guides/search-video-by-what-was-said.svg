<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 260" width="720" height="260" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
<title id="t">Finding a clip by what was said in it, in MediaFlowSwift</title>
<desc id="d">Four steps from left to right: transcribe the clips; in the Transcript tab type a word in Search and tick All clips; click a result to select that clip; click a line's time in Read to jump the preview. A note below says the toolbar search matches file name, notes, tags, category, camera and scene, not transcripts.</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#555"/></marker></defs>
<rect x="0.5" y="0.5" width="719" height="259" rx="10" fill="#ffffff" stroke="#dddddd"/>
<rect x="8" y="30" width="156" height="140" rx="8" fill="#f4f4f4" stroke="#555" stroke-width="1.5"/>
<text x="86.0" y="75" text-anchor="middle" font-size="15" font-weight="700" fill="#1d1d1f">1  Transcribe</text>
<text x="86.0" y="95" text-anchor="middle" font-size="14" font-weight="400" fill="#1d1d1f">Workflow → Analyze…</text>
<text x="86.0" y="115" text-anchor="middle" font-size="14" font-weight="400" fill="#1d1d1f">→ Transcribe,</text>
<text x="86.0" y="135" text-anchor="middle" font-size="14" font-weight="400" fill="#1d1d1f">on this Mac by default</text>
<line x1="168" y1="100.0" x2="188" y2="100.0" stroke="#555" stroke-width="1.8" marker-end="url(#a)"/>
<rect x="190" y="30" width="156" height="140" rx="8" fill="#f4f4f4" stroke="#2a6df4" stroke-width="2.5"/>
<text x="268.0" y="75" text-anchor="middle" font-size="15" font-weight="700" fill="#2a6df4">2  Search</text>
<text x="268.0" y="95" text-anchor="middle" font-size="14" font-weight="400" fill="#1d1d1f">Transcript tab:</text>
<text x="268.0" y="115" text-anchor="middle" font-size="14" font-weight="400" fill="#1d1d1f">type a word or phrase,</text>
<text x="268.0" y="135" text-anchor="middle" font-size="14" font-weight="400" fill="#1d1d1f">tick All clips</text>
<line x1="350" y1="100.0" x2="370" y2="100.0" stroke="#555" stroke-width="1.8" marker-end="url(#a)"/>
<rect x="373" y="30" width="156" height="140" rx="8" fill="#f4f4f4" stroke="#555" stroke-width="1.5"/>
<text x="451.0" y="75" text-anchor="middle" font-size="15" font-weight="700" fill="#1d1d1f">3  Click a result</text>
<text x="451.0" y="95" text-anchor="middle" font-size="14" font-weight="400" fill="#1d1d1f">MediaFlowSwift</text>
<text x="451.0" y="115" text-anchor="middle" font-size="14" font-weight="400" fill="#1d1d1f">selects the clip</text>
<text x="451.0" y="135" text-anchor="middle" font-size="14" font-weight="400" fill="#1d1d1f">with that line</text>
<line x1="532" y1="100.0" x2="552" y2="100.0" stroke="#555" stroke-width="1.8" marker-end="url(#a)"/>
<rect x="556" y="30" width="156" height="140" rx="8" fill="#f4f4f4" stroke="#555" stroke-width="1.5"/>
<text x="634.0" y="85" text-anchor="middle" font-size="15" font-weight="700" fill="#1d1d1f">4  Jump the preview</text>
<text x="634.0" y="105" text-anchor="middle" font-size="14" font-weight="400" fill="#1d1d1f">click the line’s</text>
<text x="634.0" y="125" text-anchor="middle" font-size="14" font-weight="400" fill="#1d1d1f">time in Read</text>
<rect x="8" y="190" width="704" height="56" rx="8" fill="#f4f4f4" stroke="#555" stroke-width="1.5"/>
<text x="360.0" y="213" text-anchor="middle" font-size="15" font-weight="700" fill="#1d1d1f">The toolbar search (Cmd+F) does not read transcripts</text>
<text x="360.0" y="233" text-anchor="middle" font-size="14" font-weight="400" fill="#1d1d1f">It matches file name, notes, tags, category, camera and scene</text>
</svg>
