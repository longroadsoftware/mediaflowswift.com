title: MediaFlowSwift
url: https://mediaflowswift.com
baseurl: ""
repository: longroadsoftware/mediaflowswift.com
markdown: kramdown
kramdown:
  input: GFM
  auto_ids: true
  hard_wrap: false
include:
  - _headers
  - _redirects
exclude:
  - README.md
  # The app zip is over Cloudflare's 25 MiB asset limit (1.12: 48.8 MB); the Worker streams it from the GitHub Release.
  - downloads/*.zip
  - Gemfile
  - Gemfile.lock
  - wrangler.jsonc
  - cloudflare
  - vendor
  - node_modules
  - images/LICENSES.md
  - tools
